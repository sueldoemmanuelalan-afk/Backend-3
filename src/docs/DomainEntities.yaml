paths:
  /api/stores:
    get:
      summary: Obtener listado de tiendas / sucursales
      tags:
        - Stores
      responses:
        "200":
          description: Listado de tiendas devuelto exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: 65a8fbbd825c82c17e064ea1
                        name:
                          type: string
                          example: Sucursal Central
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'