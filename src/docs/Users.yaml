paths:
  /api/users:
    get:
      summary: Obtener listado de usuarios con paginación
      tags:
        - Users
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número de página
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Cantidad de elementos por página
      responses:
        "200":
          description: Lista de usuarios obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  totalRecords:
                    type: integer
                    example: 50
                  totalPages:
                    type: integer
                    example: 5
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un nuevo usuario
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
              properties:
                first_name:
                  type: string
                  example: Juan
                last_name:
                  type: string
                  example: Pérez
                email:
                  type: string
                  example: juan.perez@example.com
                role:
                  type: string
                  enum: [customer, driver, admin]
                  example: customer
      responses:
        "201":
          description: Usuario creado exitosamente.
        "400":
          description: Datos inválidos o incompletos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{uid}:
    get:
      summary: Obtener usuario por ID
      tags:
        - Users
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario encontrado.
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Actualizar un usuario existente
      tags:
        - Users
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                role:
                  type: string
      responses:
        "200":
          description: Usuario actualizado exitosamente.
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un usuario por ID
      tags:
        - Users
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usuario eliminado exitosamente.
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{uid}/documents:
    post:
      summary: Subir documento de usuario
      description: Carga un archivo (DNI, LICENSE, PASSPORT, TAX_ID, PROOF_OF_ADDRESS) y lo asocia al usuario correspondiente.
      tags:
        - Users
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: ID único del usuario en MongoDB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - docType
              properties:
                docType:
                  type: string
                  enum: [DNI, LICENSE, PASSPORT, TAX_ID, PROOF_OF_ADDRESS]
                  example: DNI
                  description: Tipo de documento adjunto.
                document:
                  type: string
                  format: binary
                  description: Archivo físico (formatos permitidos JPG, PNG, WEBP, PDF - máx 5MB).
      responses:
        "200":
          description: Documento subido y asociado correctamente al usuario.
        "400":
          description: Archivo faltante, tipo de archivo o tipo de documento inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'