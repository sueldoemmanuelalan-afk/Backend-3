paths:
  /api/orders:
    get:
      summary: Obtener listado de pedidos con paginación
      tags:
        - Orders
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Lista de pedidos obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  totalRecords:
                    type: integer
                  totalPages:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un nuevo pedido
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - store
                - items
              properties:
                customer:
                  type: string
                store:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
      responses:
        "201":
          description: Pedido creado exitosamente.
        "400":
          description: Datos de pedido inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}:
    get:
      summary: Obtener pedido por ID
      tags:
        - Orders
      parameters:
        - in: path
          name: oid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pedido encontrado.
        "404":
          description: Pedido no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un pedido por ID
      tags:
        - Orders
      parameters:
        - in: path
          name: oid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pedido eliminado exitosamente.
        "404":
          description: Pedido no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}/status:
    patch:
      summary: Actualizar estado de un pedido
      tags:
        - Orders
      parameters:
        - in: path
          name: oid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, in_transit, delivered, cancelled]
      responses:
        "200":
          description: Estado del pedido actualizado exitosamente.
        "400":
          description: Estado inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Pedido no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}/proof:
    post:
      summary: Subir comprobante de entrega para un pedido
      description: Carga un comprobante de entrega (imagen o PDF) y lo asocia al pedido indicado.
      tags:
        - Orders
      parameters:
        - in: path
          name: oid
          required: true
          schema:
            type: string
          description: ID único de la orden en MongoDB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - proof
              properties:
                proof:
                  type: string
                  format: binary
                  description: Archivo del comprobante de entrega (JPG, PNG, WEBP, PDF - máx 5MB).
      responses:
        "200":
          description: Comprobante subido y asociado correctamente al pedido.
        "400":
          description: Archivo de comprobante faltante o formato no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Orden no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'